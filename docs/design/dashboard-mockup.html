<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panin Collection - Rancangan Dashboard</title>
<style>
:root{
  --brand-50:#eff6ff;--brand-100:#dbeafe;--brand-200:#bfdbfe;--brand-300:#93c5fd;--brand-400:#60a5fa;--brand-500:#2f6fdc;--brand-600:#1d5bc4;--brand-700:#1649a0;--brand-800:#123b82;--brand-900:#0e2d65;--brand-950:#0a1f48;
  --bg:#f1f5f9;--surface:#fff;--surface-2:#f8fafc;--line:#e2e8f0;--text:#0f172a;--muted:#64748b;--faint:#94a3b8;
  --side:#0a1f48;--side-line:rgba(255,255,255,.1);
  --ok:#059669;--ok-bg:#ecfdf5;--warn:#d97706;--warn-bg:#fffbeb;--bad:#e11d48;--bad-bg:#fff1f2;--info:#1d5bc4;--info-bg:#eff6ff;
  --shadow:0 1px 2px rgb(15 23 42/.05),0 1px 3px rgb(15 23 42/.06);
  --radius:14px;
  --sidew:16rem;--siderail:4.25rem;
}
[data-theme=dark]{
  --bg:#0b1220;--surface:#111a2e;--surface-2:#0f172a;--line:#1f2a44;--text:#e5ecf8;--muted:#94a3b8;--faint:#64748b;
  --side:#070f22;--ok-bg:#052e22;--warn-bg:#35240a;--bad-bg:#3a0f1b;--info-bg:#0e2347;--shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,"Segoe UI Variable","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
a{color:var(--brand-700);text-decoration:none}
[data-theme=dark] a{color:var(--brand-300)}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ic.s{width:16px;height:16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ===== shell ===== */
.app{display:flex;min-height:100vh}
.side{position:sticky;top:0;height:100vh;flex:none;width:var(--sidew);transition:width .25s ease;z-index:40}
.side-panel{position:absolute;inset:0 auto 0 0;width:var(--sidew);background:var(--side);color:#cbd5e1;display:flex;flex-direction:column;overflow:hidden;transition:width .2s ease,box-shadow .2s ease}
.brand{display:flex;align-items:center;gap:.75rem;height:64px;padding:0 1rem;flex:none}
.logo{width:36px;height:36px;border-radius:10px;background:var(--brand-500);display:grid;place-items:center;color:#fff;font-weight:700;flex:none}
.brand b{display:block;color:#fff;font-size:14px;white-space:nowrap}.brand small{color:#94a3b8;font-size:12px}
.nav{flex:1;overflow-y:auto;padding:0 .75rem 1rem;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent}
.grp{padding:1rem .75rem .25rem;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#64748b;white-space:nowrap}
.item{position:relative;display:flex;align-items:center;gap:.65rem;width:100%;padding:.55rem .75rem;border-radius:10px;color:#cbd5e1;font-weight:500;text-align:left;white-space:nowrap;transition:background .15s}
.item:hover{background:rgba(255,255,255,.08);color:#fff}
.item.active{background:rgba(255,255,255,.12);color:#fff}
.item.active::before{content:"";position:absolute;left:-.75rem;top:.4rem;bottom:.4rem;width:4px;border-radius:0 4px 4px 0;background:var(--brand-300)}
.item .lbl{overflow:hidden;transition:opacity .15s,max-width .15s;max-width:12rem}
.item .chev{margin-left:auto;transition:transform .2s}
.item[aria-expanded=true] .chev{transform:rotate(90deg)}
.item .badge{margin-left:auto;background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:0 .45rem;line-height:1.3}
.sub{margin:.1rem 0 .4rem 1.35rem;padding-left:.6rem;border-left:1px solid var(--side-line)}
.sub[hidden]{display:none}
.sub .item{padding:.45rem .65rem;font-size:13px}
.sidever{border-top:1px solid var(--side-line);padding:.75rem 1.25rem;font-size:12px;color:#64748b;white-space:nowrap}
/* diciutkan: rel ikon, melebar saat disorot (seperti BNPL) */
@media(min-width:1024px){
  .collapsed.side{width:var(--siderail)}
  .collapsed .side-panel{width:var(--siderail)}
  .collapsed .side-panel:hover,.collapsed .side-panel:focus-within{width:var(--sidew);box-shadow:0 25px 50px -12px rgb(0 0 0/.5);transition:width .2s ease .15s,box-shadow .2s ease .15s}
  .collapsed .lbl,.collapsed .brand-text{opacity:0;max-width:0}
  .collapsed .side-panel:hover .lbl,.collapsed .side-panel:focus-within .lbl,.collapsed .side-panel:hover .brand-text,.collapsed .side-panel:focus-within .brand-text{opacity:1;max-width:12rem;transition:opacity .2s ease .15s,max-width .2s ease .15s}
  .collapsed .grp{color:transparent;position:relative}
  .collapsed .grp::after{content:"";position:absolute;left:1rem;right:1rem;top:55%;height:1px;background:var(--side-line)}
  .collapsed .side-panel:hover .grp,.collapsed .side-panel:focus-within .grp{color:#64748b}
  .collapsed .side-panel:hover .grp::after,.collapsed .side-panel:focus-within .grp::after{opacity:0}
  .collapsed .item .chev,.collapsed .item .badge{opacity:0}
  .collapsed .side-panel:hover .item .chev,.collapsed .side-panel:hover .item .badge{opacity:1}
  .collapsed .sub{display:none}
  .collapsed .side-panel:hover .sub:not([hidden]){display:block}
  .collapsed .sidever{opacity:0}
  .collapsed .side-panel:hover .sidever{opacity:1}
}
@media(max-width:1023px){
  .side{position:fixed;left:0;width:var(--sidew);transform:translateX(-100%);transition:transform .25s}
  .side.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgb(15 23 42/.5);z-index:30;display:none}.scrim.show{display:block}
}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:.75rem;height:64px;padding:0 1.25rem;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;gap:.4rem;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:.45rem .7rem;font-weight:500}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--brand-600);border-color:var(--brand-600);color:#fff}.btn.primary:hover{background:var(--brand-700)}
.btn.icon{padding:.45rem}
.search{display:flex;align-items:center;gap:.5rem;flex:1;max-width:26rem;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:.45rem .75rem;color:var(--muted)}
.search kbd{margin-left:auto;border:1px solid var(--line);border-radius:6px;padding:0 .35rem;font-size:11px}
.sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:.4rem;border-radius:99px;padding:.15rem .65rem;font-size:12px;font-weight:600}
.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.bad{background:var(--bad-bg);color:var(--bad)}.chip.info{background:var(--info-bg);color:var(--info)}
.dot{width:8px;height:8px;border-radius:99px;background:currentColor}
.avatar{width:36px;height:36px;border-radius:99px;background:var(--brand-600);color:#fff;display:grid;place-items:center;font-weight:600;font-size:13px}
.who{line-height:1.2}.who small{display:block;color:var(--muted);font-size:12px}
.bell{position:relative}.bell .n{position:absolute;top:-4px;right:-4px;background:var(--bad);color:#fff;border-radius:99px;font-size:10px;padding:0 .3rem}
nav.tabs{display:flex;gap:.25rem;overflow-x:auto;padding:0 1rem;background:var(--surface);border-bottom:1px solid var(--line)}
nav.tabs button{white-space:nowrap;padding:.8rem 1rem;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
nav.tabs button[aria-selected=true]{color:var(--brand-700);border-color:var(--brand-600)}
[data-theme=dark] nav.tabs button[aria-selected=true]{color:var(--brand-300)}
main{padding:1.25rem;max-width:90rem;width:100%;margin:0 auto}
@media(min-width:1024px){main{padding:1.5rem}}

/* ===== dashboard ===== */
.hero{position:relative;overflow:hidden;border-radius:18px;padding:1.5rem;color:#fff;background:linear-gradient(120deg,var(--brand-700),var(--brand-800) 60%,var(--brand-900));box-shadow:var(--shadow)}
.hero::after{content:"";position:absolute;right:-70px;top:-90px;width:320px;height:320px;border-radius:50%;border:1px solid rgb(255 255 255/.18);box-shadow:0 0 0 40px rgb(255 255 255/.04)}
.hero p{margin:0;color:rgb(255 255 255/.75)}.hero h1{margin:.25rem 0 0;font-size:1.65rem;letter-spacing:-.01em}
.hero .row{position:relative;display:flex;flex-wrap:wrap;gap:1rem;justify-content:space-between;align-items:flex-end}
.hero .chips{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1rem}
.hchip{display:inline-flex;align-items:center;gap:.45rem;border-radius:99px;padding:.3rem .8rem;background:rgb(255 255 255/.14);box-shadow:inset 0 0 0 1px rgb(255 255 255/.22);font-size:12.5px;font-weight:500;color:#fff}
.hbtn{display:inline-flex;align-items:center;gap:.4rem;border-radius:10px;padding:.5rem .85rem;font-weight:600;background:#fff;color:var(--brand-800)}
.hbtn.ghost{background:rgb(255 255 255/.14);color:#fff;box-shadow:inset 0 0 0 1px rgb(255 255 255/.25)}
h2.sec{margin:1.5rem 0 .6rem;font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.grid{display:grid;gap:1rem}
.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr}.g2{grid-template-columns:1fr}
@media(min-width:1024px){.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:2fr 1fr}.g2{grid-template-columns:1fr 1fr}.g3e{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:1.1rem}
.card h3{margin:0;font-size:14px;font-weight:600}.card .sub2{margin:.15rem 0 0;color:var(--muted);font-size:12px}
.card .head{display:flex;justify-content:space-between;align-items:flex-start;gap:.5rem;margin-bottom:.9rem}
.stat{position:relative;display:block;transition:transform .15s,box-shadow .15s;color:inherit}
.stat:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgb(15 23 42/.1)}
.tile{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--info-bg);color:var(--info)}
.tile.ok{background:var(--ok-bg);color:var(--ok)}.tile.warn{background:var(--warn-bg);color:var(--warn)}.tile.bad{background:var(--bad-bg);color:var(--bad)}
.stat .go{position:absolute;right:1rem;top:1rem;color:var(--faint)}
.stat .lab{margin-top:.8rem;font-weight:500}.stat .val{font-size:1.9rem;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
.stat .hint{color:var(--muted);font-size:12px;margin-top:.15rem}
.trend{display:inline-flex;align-items:center;gap:.2rem;font-size:12px;font-weight:600;margin-left:.4rem}
.trend.up{color:var(--ok)}.trend.down{color:var(--bad)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;background:var(--brand-500)}
.bar.ok i{background:var(--ok)}.bar.warn i{background:var(--warn)}.bar.bad i{background:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:.9rem;font-size:12px;color:var(--muted)}.legend b{color:var(--text);font-variant-numeric:tabular-nums}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:.35rem}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:.55rem .6rem;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:.6rem;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:.75rem;align-items:center;padding:.7rem 0;border-bottom:1px solid var(--line)}.list li:last-child{border-bottom:0}
.list .t{min-width:0;flex:1}.list .t b{display:block;font-weight:600}.list .t small{color:var(--muted)}
.tag{display:inline-block;border-radius:6px;padding:.05rem .45rem;font-size:11.5px;font-weight:600;background:var(--info-bg);color:var(--info);margin-right:.25rem}
.tag.warn{background:var(--warn-bg);color:var(--warn)}.tag.bad{background:var(--bad-bg);color:var(--bad)}.tag.ok{background:var(--ok-bg);color:var(--ok)}
.mini{font-size:12px;padding:.3rem .6rem}
.cols{display:flex;align-items:flex-end;gap:5px;height:170px}
.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;position:relative}
.col .stack{border-radius:6px 6px 0 0;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;background:var(--line);min-height:2px}
.xl{display:flex;gap:5px;margin-top:6px;font-size:10px;color:var(--faint)}.xl span{flex:1;text-align:center}.xl .now{color:var(--brand-700);font-weight:700}
.ring{--p:68;width:132px;height:132px;border-radius:50%;background:conic-gradient(var(--brand-500) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none}
.ring div{width:100px;height:100px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center;line-height:1.1}
.ring b{font-size:1.6rem;letter-spacing:-.02em}.ring small{color:var(--muted);font-size:11px}
.heat{display:grid;gap:3px;font-size:12px;font-variant-numeric:tabular-nums}
.heat div{padding:.45rem .3rem;text-align:center;border-radius:6px}.heat .h{font-weight:600;color:var(--muted);background:none}
.tl{list-style:none;margin:0;padding:0 0 0 .9rem;border-left:2px solid var(--line)}
.tl li{position:relative;padding:0 0 .9rem .9rem}.tl li::before{content:"";position:absolute;left:-1.45rem;top:.3rem;width:10px;height:10px;border-radius:99px;background:var(--brand-500);box-shadow:0 0 0 3px var(--surface)}
.tl small{color:var(--muted)}
.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:.6rem}
.quick a{display:flex;align-items:center;gap:.6rem;border:1px solid var(--line);border-radius:12px;padding:.7rem;color:var(--text);font-weight:500}
.quick a:hover{border-color:var(--brand-300);background:var(--info-bg)}
.skel{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--line),var(--surface-2),var(--line));background-size:200% 100%;animation:sh 1.4s infinite}
@keyframes sh{to{background-position:-200% 0}}
.note{margin-top:2rem;padding:1rem;border:1px dashed var(--line);border-radius:12px;color:var(--muted);font-size:12.5px}
.view[hidden]{display:none}
.foot{padding:0 1.5rem 1.5rem;color:var(--faint);font-size:12px}
a.stat,[data-theme=dark] a.stat,.quick a,[data-theme=dark] .quick a{color:var(--text)}
.hbtn,[data-theme=dark] .hbtn{color:var(--brand-800)}.hbtn.ghost,[data-theme=dark] .hbtn.ghost{color:#fff}
@media(max-width:640px){.search,.who,header.top .chip{display:none}header.top{padding:0 .75rem}.lt{display:none}.hero h1{font-size:1.35rem}main{padding:.85rem}}
@media print{.side,header.top,nav.tabs{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side" id="side" aria-label="Menu samping">
    <div class="side-panel">
      <div class="brand"><span class="logo">P</span><div class="brand-text"><b>Panin Collection</b><small>Collection Management</small></div></div>
      <nav class="nav" id="nav"></nav>
      <div class="sidever">Panin Collection v1.0 (rancangan)</div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <header class="top">
      <button class="btn icon" id="mobtoggle" aria-label="Buka menu" style="display:none"></button>
      <button class="btn icon" id="toggle" aria-label="Sembunyikan menu samping" title="Sembunyikan menu samping (Ctrl+B)" aria-expanded="true"></button>
      <div class="search" id="search"><span id="searchic"></span> Cari debitur, menu, report… <kbd>Ctrl K</kbd></div>
      <div class="sp"></div>
      <span class="chip warn" title="Tanggal data terakhir diperbarui"><span class="dot"></span>Data per 7 Mei 2025</span>
      <button class="btn icon" id="theme" aria-label="Ganti tema" title="Terang / gelap"></button>
      <button class="btn icon bell" id="bell" aria-label="Peringatan"><span class="n">3</span></button>
      <div style="display:flex;align-items:center;gap:.6rem"><span class="avatar">AD</span><span class="who" id="who"><b>Admin Dms</b><small>LT0003</small></span></div>
      <button class="btn" id="logout"></button>
    </header>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Modul"></nav>
    <main id="main"></main>
    <div class="foot">Rancangan tampilan. Semua angka dan nama pada halaman ini fiktif.</div>
  </div>
</div>

/* ===== komponen kecil ===== */
const stat=(icon,tone,label,val,hint,go='')=>`<a class="card stat" href="#">${ic('arrow-up-right','s go')}<span class="tile ${tone}">${ic(icon)}</span><div class="lab">${label}</div><div class="val">${val}</div><div class="hint">${hint}</div></a>`;
const hero=(sub,title,chips,btns)=>`<section class="hero"><div class="row"><div><p>${sub}</p><h1>${title}</h1><div class="chips">${chips}</div></div><div style="display:flex;gap:.5rem;flex-wrap:wrap">${btns}</div></div></section>`;
const hc=(c,t)=>`<span class="hchip"><span class="dot" style="color:${c}"></span>${t}</span>`;
function stacked(rows,a,b,ca,cb){const max=Math.max(1,...rows.map(r=>r[a]+r[b]));
 return `<div class="cols">${rows.map(r=>{const t=r[a]+r[b];return `<div class="col" title="${r.d} Okt: ${r[a]} ${a}, ${r[b]} ${b}"><div class="stack" style="height:${t?Math.max(4,t*100/max):1}%">${t?`<div style="height:${r[b]*100/t}%;background:${cb}"></div><div style="height:${100-r[b]*100/t}%;background:${ca}"></div>`:''}</div></div>`}).join('')}</div><div class="xl">${rows.map((r,i)=>`<span class="${i==rows.length-1?'now':''}">${r.d}</span>`).join('')}</div>`}
function linechart(vals,labels,suffix='%'){const w=560,h=190,p=28,min=Math.min(...vals)-.3,max=Math.max(...vals)+.3;const x=i=>p+i*(w-2*p)/(vals.length-1),y=v=>h-p-(v-min)*(h-2*p)/(max-min);
 const path=vals.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+','+y(v).toFixed(1)).join(' ');
 const area=path+` L${x(vals.length-1)},${h-p} L${x(0)},${h-p} Z`;
 return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Tren rasio NPL 12 bulan"><defs><linearGradient id="lg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--brand-500)" stop-opacity=".28"/><stop offset="1" stop-color="var(--brand-500)" stop-opacity="0"/></linearGradient></defs>
 ${[0,1,2].map(k=>{const v=min+(max-min)*k/2;return `<line x1="${p}" x2="${w-p}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="0" y="${y(v)+4}" font-size="10" fill="var(--faint)">${v.toFixed(1)}${suffix}</text>`}).join('')}
 <path d="${area}" fill="url(#lg)"/><path d="${path}" fill="none" stroke="var(--brand-500)" stroke-width="2.4" stroke-linejoin="round"/>
 ${vals.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="${i==vals.length-1?5:2.5}" fill="${i==vals.length-1?'var(--brand-600)':'var(--surface)'}" stroke="var(--brand-500)" stroke-width="2"/>`).join('')}
 ${labels.map((l,i)=>`<text x="${x(i)}" y="${h-6}" font-size="10" text-anchor="middle" fill="var(--faint)">${l}</text>`).join('')}</svg>`}
const pct=(v,cls)=>`<div style="display:flex;align-items:center;gap:.5rem"><div class="bar ${cls}" style="width:90px"><i style="width:${v}%"></i></div><b style="font-variant-numeric:tabular-nums">${v}%</b></div>`;
const toneOf=v=>v>=85?'ok':v>=60?'warn':'bad';

/* ===== perilaku shell ===== */
let mod='col';
const $=s=>document.querySelector(s);
function renderNav(){
  const m=MENUS[mod];$('.brand-text small').textContent=m.title;
  $('#nav').innerHTML=m.items.map((it,k)=>{
    if(it.g)return `<div class="grp">${it.g}</div>`;
    const kids=it.kids?`<div class="sub" hidden>${it.kids.map(x=>`<button class="item"><span class="lbl">${x}</span></button>`).join('')}</div>`:'';
    return `<button class="item ${it.active?'active':''}" ${it.kids?'aria-expanded="false"':''} data-k="${k}">${ic(it.i)}<span class="lbl">${it.t}</span>${it.kids?ic('chart','chev s').replace(/<path[^>]*>/,'<path d="M8.25 4.5l7.5 7.5-7.5 7.5"/>'):''}${it.badge?`<span class="badge">${it.badge}</span>`:''}</button>${kids}`}).join('');
  document.querySelectorAll('#nav .item[aria-expanded]').forEach(b=>b.onclick=()=>{const open=b.getAttribute('aria-expanded')==='true';b.setAttribute('aria-expanded',!open);b.nextElementSibling.hidden=open});
}
function renderTabs(){
  $('#tabs').innerHTML=Object.entries(MENUS).map(([k,v])=>`<button role="tab" aria-selected="${k===mod}" data-m="${k}">${v.title}</button>`).join('');
  document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{mod=b.dataset.m;renderTabs();renderNav();renderMain();location.hash=mod});
}
function renderMain(){$('#main').innerHTML=VIEWS[mod]()}
const SIDEKEY='panin.side-hidden';
function setCollapsed(v){$('#side').classList.toggle('collapsed',v);$('#toggle').setAttribute('aria-expanded',!v);$('#toggle').setAttribute('aria-label',v?'Tampilkan menu samping':'Sembunyikan menu samping');try{localStorage.setItem(SIDEKEY,v?'1':'0')}catch(e){}}
$('#toggle').innerHTML=`<svg class="ic" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>`;
$('#mobtoggle').innerHTML=ic('queue');$('#searchic').innerHTML=ic('search','s');$('#theme').innerHTML=ic('swatch');$('#bell').insertAdjacentHTML('afterbegin',ic('bell'));$('#logout').innerHTML=ic('logout','s')+'<span class="lt"> Logout</span>';
$('#toggle').onclick=()=>setCollapsed(!$('#side').classList.contains('collapsed'));
$('#mobtoggle').onclick=()=>{$('#side').classList.toggle('open');$('#scrim').classList.toggle('show')};
$('#scrim').onclick=()=>{$('#side').classList.remove('open');$('#scrim').classList.remove('show')};
$('#theme').onclick=()=>{const d=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=d?'light':'dark';try{localStorage.setItem('panin.theme',d?'light':'dark')}catch(e){}};
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='b'){e.preventDefault();setCollapsed(!$('#side').classList.contains('collapsed'))}});
function responsive(){const m=innerWidth<1024;$('#mobtoggle').style.display=m?'':'none';$('#toggle').style.display=m?'none':''}
addEventListener('resize',responsive);responsive();
try{if(localStorage.getItem(SIDEKEY)==='1')setCollapsed(true);const t=localStorage.getItem('panin.theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
const q=new URLSearchParams(location.search);if(q.get('theme'))document.documentElement.dataset.theme=q.get('theme');if(q.get('side')==='1')setCollapsed(true);
if(MENUS[location.hash.slice(1)])mod=location.hash.slice(1);
renderTabs();renderNav();renderMain();
</script>
