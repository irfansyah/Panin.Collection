# SQL Server lokal untuk pengembangan: salinan DB LOGIN yang boleh diubah (mis. RFMENUX.MENUURL).
# Jalankan: docker compose -f docker/docker-compose.yml up -d
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: panin-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "14333:1433"
    volumes:
      - panin-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"select 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Opsional, hanya untuk pengembangan: tujuan log selain berkas (lihat docs/LOGGING.md).
  #   docker compose -f docker/docker-compose.yml --profile observability up -d
  seq:
    profiles: [observability]
    image: datalust/seq:latest
    container_name: panin-seq
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"   # hanya lokal; di server beri password admin
    ports:
      - "5341:80"
  aspire:
    profiles: [observability]
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    container_name: panin-aspire
    environment:
      DASHBOARD__FRONTEND__AUTHMODE: Unsecured   # hanya lokal
      DASHBOARD__OTLP__AUTHMODE: Unsecured
    ports:
      - "18888:18888"   # UI dashboard
      - "4317:18889"    # OTLP gRPC (log dikirim ke sini)

volumes:
  panin-sql-data:
