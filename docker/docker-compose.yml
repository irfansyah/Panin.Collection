# SQL Server lokal untuk pengembangan: salinan DB LOGIN yang boleh diubah (mis. RFMENUX.MENUURL).
# Jalankan: docker compose -f docker/docker-compose.yml up -d
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: panin-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "14333:1433"
    volumes:
      - panin-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"select 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
volumes:
  panin-sql-data:
